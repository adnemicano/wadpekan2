<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Data Mahasiswa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1 class="mx-auto p-2" style="width: 200px">Tambah Data Mahasiswa</h1>
    <hr />
    <br />

    <form class="mx-auto" style="width: 50%">
      <div class="mb-3">
        <label for="nim" class="form-label" style="font-weight: 700;">NIM</label>
        <input type="text" class="form-control" id="nim" name="nim" />
      </div>

      <div class="mb-3">
        <label for="angkatan" class="form-label" style="font-weight: 700;">Angkatan</label>
        <input
          type="number"
          class="form-control"
          id="angkatan"
          name="angkatan"
        />
      </div>

      <div class="mb-3">
        <label for="sks" class="form-label" style="font-weight: 700;">SKS Lulus</label>
        <input type="number" class="form-control" id="sks" name="sks" />
      </div>

      <div class="mb-3">
        <label for="status" class="form-label" style="font-weight: 700;">Status Keaktifan</label>
        <select class="form-select" id="status" name="status">
          <option value="">-- Pilih Status --</option>
          <option value="Aktif">Aktif</option>
          <option value="Tidak Aktif">Tidak Aktif</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Tambah Data</button>
    </form>

  </body>
</html>
