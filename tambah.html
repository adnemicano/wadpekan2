<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Topik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<form>
  <div class="mb-3">
    <label for="rumpunilmuTextInput" class="form-label">Rumpun Ilmu</label>
    <input type="text" id="rumpunilmuTextInput" class="form-control" placeholder="Input Rumpun Ilmu">
  </div>
  <div class="mb-3">
    <label for="topikrisetTextInput" class="form-label">Pengelolaan Topik Riset</label>
    <input type="text" class="form-control" id="topikrisetTextInput" placeholder="Input Topik Riset">
  </div>
  <div class="mb-3">
    <label for="deskripsifokusTextInput" class="form-label">Deskripsi Fokus</label>
    <input type="text" class="form-control" id="deskripsifokusTextInput" placeholder="Masukkan Deskripsi Fokus">
  </div>
  <div class="mb-3">
    <label for="katakunciTextInput" class="form-label">Kata Kunci Penelitian</label>
    <input type="text" class="form-control" id="katakunciTextInput" placeholder="Masukkan Kata Kunci">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</body>
</html>
